<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Kubernetes 靜態網站</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f0f4f8; }
    .card { background: white; border-radius: 12px; padding: 40px; max-width: 600px; margin: auto; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    h1 { color: #1a3c6e; }
    p { color: #555; font-size: 1.1em; }
    .badge { background: #1a3c6e; color: white; padding: 6px 14px; border-radius: 20px; font-size: 0.9em; }
    .stack { margin-top: 24px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .stack span { background: #e3ecf7; color: #1a3c6e; padding: 4px 10px; border-radius: 6px; font-size: 0.85em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from Kubernetes!</h1>
    <p>此網站由 <strong>Nginx</strong> 部署於 <strong>Minikube Kubernetes</strong> 環境</p>
    <p><span class="badge">Pod 運行中</span></p>
    <div class="stack">
      <span>Docker</span>
      <span>Containerd</span>
      <span>Kubernetes</span>
      <span>Git</span>
      <span>GitLab CI</span>
    </div>
    <p>周子傑_靜態網頁展示</p>
  </div>
</body>
</html>
